apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backstage-db
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"      # after local-path (-1), before backstage (1)
spec:
  project: default
  source:
    repoURL: https://github.com/moabdelazem/My_ArgoCD_Applications.git
    targetRevision: main
    path: manifests/backstage
  destination:
    server: https://kubernetes.default.svc
    namespace: backstage                   # same ns as Backstage, so its secrets are mountable
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry:
      limit: 5
      backoff: { duration: 10s, factor: 2, maxDuration: 2m }
    syncOptions:
      - CreateNamespace=true
