apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backstage
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"      # after backstage-db (0): needs the DB + its secrets
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://backstage.github.io/charts
    chart: backstage
    targetRevision: 2.8.1              # check for newer before bumping
    helm:
      releaseName: backstage
      values: |
        # ---------------------------------------------------------------
        # Reachability: http://backstage.localhost via k3s' built-in Traefik.
        # Browsers resolve *.localhost to 127.0.0.1 on their own — nothing to
        # configure. Only needed if the cluster is on another machine: one line
        # in /etc/hosts, "<node-ip> backstage.localhost".
        # ---------------------------------------------------------------
        service:
          type: ClusterIP
          ports:
            name: http
            backend: 7007

        ingress:
          enabled: true
          className: traefik
          host: backstage.localhost
          path: /
          annotations:
            traefik.ingress.kubernetes.io/router.entrypoints: web
          tls:
            enabled: false
            # For TLS: point entrypoints at "websecure", set enabled: true and
            # secretName below, and add the cert-manager annotation, e.g.
            # cert-manager.io/cluster-issuer: letsencrypt
            # secretName: backstage-tls

        # The upstream chart ships no app of your own — this is the Backstage
        # project's demo image, pinned to a released tag ("latest" on this repo
        # is an unreleased build). Swap it for an image built from your own
        # Backstage repo (npx @backstage/create-app) as soon as you have one:
        # which frontend plugins are wired in is fixed at image build time and
        # cannot be changed from appConfig.
        backstage:
          image:
            registry: ghcr.io
            repository: backstage/backstage
            tag: "1.45.0"
            pullPolicy: IfNotPresent

          containerPorts:
            backend: 7007

          # Seed catalog from manifests/backstage/catalog-entities.yaml
          extraVolumes:
            - name: catalog-entities
              configMap:
                name: backstage-catalog-entities
          extraVolumeMounts:
            - name: catalog-entities
              mountPath: /app/catalog
              readOnly: true

          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits:   { memory: 1Gi }

          extraEnvVars:
            # Names the plugins still initialising when readiness returns 503.
            # Drop back to "info" once startup is clean.
            - name: LOG_LEVEL
              value: debug
            # From the backstage-postgres secret in manifests/backstage/postgres.yaml.
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: backstage-postgres
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backstage-postgres
                  key: password
            - name: BACKEND_SECRET
              valueFrom:
                secretKeyRef:
                  name: backstage-backend
                  key: backend-secret

          appConfig:
            app:
              title: "Backstage"
              baseUrl: "http://backstage.localhost"
              # The demo image runs the NEW frontend system, which installs
              # plugin features by config-driven discovery. Without this, a
              # plugin's UI renders but its APIs are never registered — that is
              # the "No implementation available for apiRef{...}" crash.
              packages: all
              support:
                url: https://github.com/backstage/backstage/issues
                items:
                  - title: Issues
                    icon: github
                    links:
                      - url: https://github.com/backstage/backstage/issues
                        title: GitHub Issues
            organization:
              name: "My Org"
            backend:
              baseUrl: "http://backstage.localhost"
              listen:
                host: 0.0.0.0
                port: 7007
              cors:
                origin: "http://backstage.localhost"
                methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
                credentials: true
              auth:
                keys:
                  - secret: "${BACKEND_SECRET}"
                # The demo backend still needs this; upstream app-config.yaml
                # carries the same line for its own backend to work.
                dangerouslyDisableDefaultAuthPolicy: true
              database:
                client: pg
                connection:
                  host: backstage-postgres.backstage.svc.cluster.local
                  port: 5432
                  user: "${POSTGRES_USER}"
                  password: "${POSTGRES_PASSWORD}"
            auth:
              environment: development
              providers:
                # Guest sign-in so the UI is usable immediately.
                # Replace with a real provider (github, oidc, ...) before exposing this.
                # userEntityRef must match a User in the catalog — the seed
                # ConfigMap provides user:default/guest.
                guest:
                  dangerouslyAllowOutsideDevelopment: true
                  userEntityRef: user:default/guest
                  ownershipEntityRefs:
                    - group:default/guests
            catalog:
              rules:
                - allow: [Component, System, API, Resource, Location, Group, User, Domain, Template]
              locations:
                - type: file
                  target: /app/catalog/entities.yaml
                  rules:
                    - allow: [Component, System, API, Resource, Location, Group, User, Domain]

        # Postgres comes from the backstage-db Application, not the chart's subchart.
        postgresql:
          enabled: false

        serviceAccount:
          create: true
  destination:
    server: https://kubernetes.default.svc
    namespace: backstage
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry:
      limit: 5                             # backend restarts until the DB accepts connections
      backoff: { duration: 10s, factor: 2, maxDuration: 2m }
    syncOptions:
      - CreateNamespace=true
