apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: backstage-db
  namespace: backstage
spec:
  instances: 1
  storage:
    size: 1Gi
  bootstrap:
    initdb:
      database: backstage
      owner: backstage
      postInitSQL:
        - ALTER ROLE backstage CREATEDB     # <-- lets Backstage create its per-plugin DBs