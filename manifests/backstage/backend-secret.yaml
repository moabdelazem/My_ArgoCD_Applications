apiVersion: v1
kind: Secret
metadata:
  name: backstage-backend
  # no namespace — applied into the app's destination namespace (backstage)
type: Opaque
stringData:
  # Backstage signs service-to-service tokens with this key. It must be valid
  # base64 — a non-base64 placeholder makes the auth service fail at startup.
  # Generated with: openssl rand -base64 32
  # It is in git in plain text: fine for a lab cluster, otherwise move it to
  # Sealed Secrets / External Secrets keeping the name + key.
  backend-secret: "GMqwOrG7jGezQyORAOkeLm1+yYdIxyAp55b8BJyAgyw="
