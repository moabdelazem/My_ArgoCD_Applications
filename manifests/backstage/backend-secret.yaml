apiVersion: v1
kind: Secret
metadata:
  name: backstage-backend
  # no namespace — applied into the app's destination namespace (backstage)
type: Opaque
stringData:
  # !! PLACEHOLDER — replace before you sync, this value is in git in plain text.
  # Backstage signs service-to-service tokens with this key.
  # Generate one with:  openssl rand -base64 32
  # For anything beyond a lab cluster, drop this file and use Sealed Secrets /
  # External Secrets Operator instead, keeping the same name + key.
  backend-secret: "REPLACE_ME_openssl_rand_base64_32"
