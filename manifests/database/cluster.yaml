apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg
  # no namespace — ArgoCD applies it into the app's destination namespace (database)
spec:
  instances: 3                    
  storage:
    size: 1Gi
    storageClass: local-path    
  bootstrap:
    initdb:
      database: appdb
      owner: appuser